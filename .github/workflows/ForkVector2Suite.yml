name: Fork Vector Size Two Suite
on:
  push:
    branches: [v2.1-28265-ci]
    paths:
      - .github/workflows/ForkVector2Suite.yml
      - .github/scripts/issue28265_vector_suite_capture.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-vector2-suite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vector-sizes:
    if: github.repository == 'kevintruong/duckdb'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/duckdb/duckdb-ci/ubuntu_24_04_amd64_compat:20260923-ade72a46
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      DUCKDB_TEST_DESCRIPTION: 'Compiled with STANDARD_VECTOR_SIZE=2. Use require vector_size 2048 to skip tests.'
    steps:
      - uses: actions/checkout@v6
      - name: Preserve batch capture helper
        run: |
          cp .github/scripts/issue28265_vector_suite_capture.py "$RUNNER_TEMP/vector_suite_capture.py"
          echo "VECTOR_EVIDENCE=$RUNNER_TEMP/vector2-suite-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vector2-suite-evidence"
      - uses: actions/checkout@v6
        with:
          ref: 2b4f45c3abdd4bd8ecc49b0ba6c69dd64e210bbc
          clean: false
      - name: Verify exact source before building
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 2b4f45c3abdd4bd8ecc49b0ba6c69dd64e210bbc
          git diff --exit-code
      - uses: ./.github/actions/ccache-action
        with:
          key: fork-vector2-control
          save: true
      - name: Build vector-size-two engine
        shell: bash
        run: |
          STANDARD_VECTOR_SIZE=2 make reldebug 2>&1 | tee "$VECTOR_EVIDENCE/build.log"
          cp build/reldebug/CMakeCache.txt "$VECTOR_EVIDENCE/CMakeCache.txt"
      - name: Replay implicated files together with the original runner flags
        shell: bash
        run: |
          printf '%s\n' test/sql/cte/materialized/cte_runtime_filter_sibling_dependencies.test test/sql/cte/materialized/cte_runtime_filter_modes.test > "$RUNNER_TEMP/cte-pair.list"
          mkdir -p "$VECTOR_EVIDENCE/focused"
          VECTOR_EVIDENCE="$VECTOR_EVIDENCE/focused" python3 "$RUNNER_TEMP/vector_suite_capture.py" --workers=1 --test-list "$RUNNER_TEMP/cte-pair.list" 2>&1 | tee "$VECTOR_EVIDENCE/focused.log"
      - name: Run the complete standard suite and retain native batch output
        shell: bash
        run: python3 "$RUNNER_TEMP/vector_suite_capture.py" 2>&1 | tee "$VECTOR_EVIDENCE/suite.log"
      - name: Preserve complete batch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vector2-suite-batch-evidence
          path: ${{ runner.temp }}/vector2-suite-evidence
          retention-days: 7
          if-no-files-found: error
