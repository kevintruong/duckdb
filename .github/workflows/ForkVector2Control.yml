name: Fork Vector Size Two Control
on:
  push:
    branches: [v2.1-28265-ci]
    paths:
      - .github/workflows/ForkVector2Control.yml
      - .github/scripts/issue28265_vector_control.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-vector2-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vector-sizes:
    if: github.repository == 'kevintruong/duckdb'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: ghcr.io/duckdb/duckdb-ci/ubuntu_24_04_amd64_compat:20260923-ade72a46
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v6
      - name: Preserve diagnostic helper
        run: |
          cp .github/scripts/issue28265_vector_control.py "$RUNNER_TEMP/vector_control.py"
          echo "VECTOR_EVIDENCE=$RUNNER_TEMP/vector2-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vector2-evidence"
      - uses: actions/checkout@v6
        with:
          ref: 2b4f45c3abdd4bd8ecc49b0ba6c69dd64e210bbc
          clean: false
      - name: Preserve regression fixture
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = 2b4f45c3abdd4bd8ecc49b0ba6c69dd64e210bbc
          git diff --exit-code
          cp test/optimizer/pushdown/join_filter_pushdown_struct.test "$RUNNER_TEMP/struct-regression.test"
      - uses: ./.github/actions/ccache-action
        with:
          key: fork-vector2-control
          save: true
      - name: Build fixed engine with vector size two
        shell: bash
        run: STANDARD_VECTOR_SIZE=2 make reldebug 2>&1 | tee "$VECTOR_EVIDENCE/fixed-build.log"
      - name: Preserve fixed native binaries for replay
        run: |
          mkdir -p "$RUNNER_TEMP/vector2-fixed/test" "$RUNNER_TEMP/vector2-fixed/src"
          cp build/reldebug/test/unittest "$RUNNER_TEMP/vector2-fixed/test/"
          cp build/reldebug/src/libduckdb.so "$RUNNER_TEMP/vector2-fixed/src/"
          cp build/reldebug/duckdb "$RUNNER_TEMP/vector2-fixed/"
          strip --strip-debug "$RUNNER_TEMP/vector2-fixed/test/unittest" "$RUNNER_TEMP/vector2-fixed/src/libduckdb.so" "$RUNNER_TEMP/vector2-fixed/duckdb"
          tar -czf "$VECTOR_EVIDENCE/fixed-native.tar.gz" -C "$RUNNER_TEMP/vector2-fixed" .
          cp build/reldebug/CMakeCache.txt "$VECTOR_EVIDENCE/fixed-CMakeCache.txt"
      - name: Collect fixed native test diagnostics
        id: fixed-diagnostics
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/vector_control.py" fixed
      - uses: actions/checkout@v6
        with:
          ref: c3dc01af116ce439464d582448b9c4d8dc412aec
          clean: false
      - name: Verify base source before rebuilding
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = c3dc01af116ce439464d582448b9c4d8dc412aec
          git diff --exit-code
      - name: Rebuild unchanged base with the same options
        shell: bash
        run: STANDARD_VECTOR_SIZE=2 make reldebug 2>&1 | tee "$VECTOR_EVIDENCE/base-build.log"
      - name: Preserve base native binaries for replay
        run: |
          mkdir -p "$RUNNER_TEMP/vector2-base/test" "$RUNNER_TEMP/vector2-base/src"
          cp build/reldebug/test/unittest "$RUNNER_TEMP/vector2-base/test/"
          cp build/reldebug/src/libduckdb.so "$RUNNER_TEMP/vector2-base/src/"
          cp build/reldebug/duckdb "$RUNNER_TEMP/vector2-base/"
          strip --strip-debug "$RUNNER_TEMP/vector2-base/test/unittest" "$RUNNER_TEMP/vector2-base/src/libduckdb.so" "$RUNNER_TEMP/vector2-base/duckdb"
          tar -czf "$VECTOR_EVIDENCE/base-native.tar.gz" -C "$RUNNER_TEMP/vector2-base" .
          cp build/reldebug/CMakeCache.txt "$VECTOR_EVIDENCE/base-CMakeCache.txt"
      - name: Collect base native test diagnostics and regression RED
        id: base-diagnostics
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/vector_control.py" base
      - name: Check both diagnostic collections completed
        env:
          FIXED_OUTCOME: ${{ steps.fixed-diagnostics.outcome }}
          BASE_OUTCOME: ${{ steps.base-diagnostics.outcome }}
        run: |
          test "$FIXED_OUTCOME" = success
          test "$BASE_OUTCOME" = success
      - name: Preserve raw before and after evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vector2-before-after-evidence
          path: ${{ runner.temp }}/vector2-evidence
          if-no-files-found: error
          retention-days: 3
